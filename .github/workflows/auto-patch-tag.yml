# Tag every push to main with the next patch version. No build, no version commit.
# Full release builds: .github/workflows/release.yml (manual)
name: Auto patch tag

on:
  push:
    branches:
      - main

concurrency:
  group: auto-patch-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: Tag next patch
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next patch
        id: next
        run: |
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [[ -n "$latest" ]]; then
            semver="${latest#v}"
          else
            semver="$(grep '^version:' apps/forja/pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)"
          fi
          IFS=. read -r major minor patch <<<"$semver"
          patch=$((patch + 1))
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "Next tag: v${major}.${minor}.${patch}"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.next.outputs.version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — skipping."
            exit 0
          fi
          git tag -a "v${VERSION}" -m "Forja ${VERSION}" "${{ github.sha }}"
          git push origin "v${VERSION}"
