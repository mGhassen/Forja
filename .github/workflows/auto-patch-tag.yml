# Bump patch semver, commit, and tag on every push to main.
# Full release builds stay manual: .github/workflows/release.yml
name: Auto patch tag

on:
  push:
    branches:
      - main

concurrency:
  group: auto-patch-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump_and_tag:
    name: Bump patch and tag
    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          chmod +x scripts/bump_version.sh
          NEW="$(./scripts/bump_version.sh patch)"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW"

      - name: Commit and tag
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists — sync pubspec to the latest tag, push, then re-run."
            exit 1
          fi
          git add apps/forja/pubspec.yaml installer/windows/setup.iss
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "Forja ${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"
