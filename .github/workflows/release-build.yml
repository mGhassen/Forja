# Shared build + publish jobs for release-new.yml and release-tag.yml.
name: Release build

on:
  workflow_call:
    inputs:
      version:
        description: Semver without v prefix (e.g. 1.4.0)
        required: true
        type: string
      prerelease:
        type: boolean
        default: false
      platform_macos:
        type: boolean
        default: true
      platform_windows:
        type: boolean
        default: true
      platform_linux:
        type: boolean
        default: true
      platform_android_tv:
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable
  APP_DIR: apps/forja

jobs:
  build_macos:
    name: macOS
    if: ${{ inputs.platform_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Build Rust FFI
        run: ./scripts/build_rust_release.sh

      - name: Build macOS app
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build macos --release

      - name: Verify installer payload
        run: ./scripts/verify_installer_payload.sh macos

      - name: Package DMG
        run: ./scripts/package_macos_dmg.sh "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Forja-macOS-dmg
          path: dist/Forja-${{ inputs.version }}-macos-arm64.dmg

  build_windows:
    name: Windows
    if: ${{ inputs.platform_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Build Rust FFI
        shell: bash
        run: ./scripts/build_rust_release.sh

      - name: Build Windows app
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build windows --release

      - name: Embed Rust in release output
        shell: bash
        run: ./scripts/embed_rust_in_release_output.sh windows

      - name: Verify installer payload
        shell: bash
        run: ./scripts/verify_installer_payload.sh windows

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $outName = "Forja-$version-windows-setup"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" `
            "/DMyOutputBaseFilename=$outName" `
            "installer\windows\setup.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Windows-setup
          path: installer/windows/Output/Forja-${{ inputs.version }}-windows-setup.exe

  build_linux:
    name: Linux
    if: ${{ inputs.platform_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libfuse2 libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            file wget curl

      - name: Build Rust FFI
        run: ./scripts/build_rust_release.sh

      - name: Build Linux app
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build linux --release

      - name: Embed Rust in release output
        run: ./scripts/embed_rust_in_release_output.sh linux

      - name: Verify installer payload
        run: ./scripts/verify_installer_payload.sh linux

      - name: Package AppImage
        run: ./scripts/package_linux_appimage.sh "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Linux-appimage
          path: dist/Forja-${{ inputs.version }}-linux-x86_64.AppImage

  build_android_tv:
    name: Android TV
    if: ${{ inputs.platform_android_tv }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Verify Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.FORJA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORJA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FORJA_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Android TV release requires FORJA_KEYSTORE_BASE64, FORJA_KEYSTORE_PASSWORD, and FORJA_KEY_PASSWORD secrets."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.FORJA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORJA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FORJA_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > apps/forja/android/release.keystore
          alias="${KEY_ALIAS:-forja}"
          if ! keytool -list \
            -keystore apps/forja/android/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$alias" >/dev/null 2>&1; then
            echo "::error::No key with alias '$alias' in decoded keystore."
            echo "Available aliases:"
            keytool -list -keystore apps/forja/android/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" || true
            exit 1
          fi

      - name: Build Android TV APKs
        working-directory: ${{ env.APP_DIR }}
        env:
          FORJA_KEY_ALIAS: ${{ secrets.FORJA_KEY_ALIAS }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            -PFORJA_KEYSTORE_PATH="${{ github.workspace }}/apps/forja/android/release.keystore" \
            -PFORJA_KEYSTORE_PASSWORD="${{ secrets.FORJA_KEYSTORE_PASSWORD }}" \
            -PFORJA_KEY_ALIAS="${FORJA_KEY_ALIAS:-forja}" \
            -PFORJA_KEY_PASSWORD="${{ secrets.FORJA_KEY_PASSWORD }}"

      - name: Package Android TV APKs
        run: ./scripts/package_android_tv_apk.sh "${{ inputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Android-TV-apks
          path: |
            dist/Forja-${{ inputs.version }}-android-tv-arm64.apk
            dist/Forja-${{ inputs.version }}-android-tv-armeabi-v7a.apk

  publish_release:
    name: Publish GitHub Release
    needs:
      - build_macos
      - build_windows
      - build_linux
      - build_android_tv
    if: >
      !cancelled() &&
      (needs.build_macos.result == 'success' || needs.build_macos.result == 'skipped') &&
      (needs.build_windows.result == 'success' || needs.build_windows.result == 'skipped') &&
      (needs.build_linux.result == 'success' || needs.build_linux.result == 'skipped') &&
      (needs.build_android_tv.result == 'success' || needs.build_android_tv.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten release assets
        run: |
          mkdir -p release-flat
          find release-assets -type f \( \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.apk' \
          \) -exec cp {} release-flat/ \;
          ls -la release-flat/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Forja ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-flat/*
