# Tag old untagged commits on the default branch (one v* patch tag per push).
# Run this before releasing if main has commits without tags.
name: Backfill version tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview tags without creating or pushing
        type: boolean
        default: false

# GITHUB_TOKEN cannot push tags when commits in the backfill range touched
# .github/workflows/* (GitHub requires workflows: write on the pusher identity).
# Non-dry-run runs require repository secret BACKFILL_GITHUB_TOKEN — a fine-grained
# PAT on this repo with Contents: Read and write + Actions: Read and write.
permissions:
  contents: read

jobs:
  backfill:
    name: Backfill v* tags
    runs-on: ubuntu-latest
    steps:
      - name: Require BACKFILL_GITHUB_TOKEN
        if: inputs.dry_run != true
        env:
          HAS_PAT: ${{ secrets.BACKFILL_GITHUB_TOKEN != '' }}
        run: |
          if [[ "$HAS_PAT" != "true" ]]; then
            echo "::error::Repository secret BACKFILL_GITHUB_TOKEN is not set."
            echo "Backfill cannot push tags from GitHub Actions using GITHUB_TOKEN alone."
            echo "Add a fine-grained PAT (this repo: Contents Read and write + Actions Read and write)"
            echo "as Settings → Secrets and variables → Actions → BACKFILL_GITHUB_TOKEN, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: inputs.dry_run == true
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        if: inputs.dry_run != true
        with:
          fetch-depth: 0
          token: ${{ secrets.BACKFILL_GITHUB_TOKEN }}
          persist-credentials: false

      - name: Configure git for tag push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "${{ inputs.dry_run }}" != "true" ]]; then
            git remote set-url origin "https://x-access-token:${{ secrets.BACKFILL_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi

      - name: List existing tags
        run: |
          git fetch origin --tags --force
          {
            echo "## Existing v* tags (newest first)"
            echo '```'
            git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Backfill tags for untagged commits
        run: |
          chmod +x scripts/backfill_version_tags.sh
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ./scripts/backfill_version_tags.sh --dry-run
          else
            ./scripts/backfill_version_tags.sh
          fi
