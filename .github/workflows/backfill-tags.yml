# Tag old untagged commits on the default branch (one v* patch tag per push).
# Run this before releasing if main has commits without tags.
name: Backfill version tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview tags without creating or pushing
        type: boolean
        default: false

# GITHUB_TOKEN cannot push tags pointing at commits that changed
# .github/workflows/* — use a PAT with the `workflow` scope as
# BACKFILL_GITHUB_TOKEN, or run ./scripts/backfill_version_tags.sh locally.
permissions:
  contents: write

jobs:
  backfill:
    name: Backfill v* tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Prefer PAT so tags on workflow-touching commits can be pushed.
          token: ${{ secrets.BACKFILL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: List existing tags
        run: |
          git fetch origin --tags --force
          {
            echo "## Existing v* tags (newest first)"
            echo '```'
            git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require PAT when backfill touches workflows
        if: inputs.dry_run != true
        env:
          HAS_PAT: ${{ secrets.BACKFILL_GITHUB_TOKEN != '' }}
        run: |
          chmod +x scripts/backfill_version_tags.sh
          if [[ "$HAS_PAT" == "true" ]]; then
            echo "BACKFILL_GITHUB_TOKEN is set."
            exit 0
          fi
          if ./scripts/backfill_version_tags.sh --range-touches-workflows; then
            echo "::error::BACKFILL_GITHUB_TOKEN is required for this backfill."
            echo "Some untagged commits modify .github/workflows/*; GITHUB_TOKEN cannot push those tags."
            echo "Add a fine-grained PAT (Contents: Read and write + Actions: Read and write) as repo secret BACKFILL_GITHUB_TOKEN,"
            echo "or run locally: ./scripts/backfill_version_tags.sh"
            exit 1
          fi
          echo "No workflow changes in backfill range; GITHUB_TOKEN is sufficient."

      - name: Backfill tags for untagged commits
        run: |
          chmod +x scripts/backfill_version_tags.sh
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ./scripts/backfill_version_tags.sh --dry-run
          else
            ./scripts/backfill_version_tags.sh
          fi
