# Forja — optional multi-platform build (manual only)
# Artifacts only — no version bump, no GitHub Release.
# Release packaging: .github/workflows/release.yml (manual)
name: Build Forja

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  APP_DIR: apps/forja
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
  WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  # Prefer publishable; fall back to legacy anon secret until that secret is renamed.
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
  RELEASE_CDN_URL: ${{ secrets.RELEASE_CDN_URL }}
  FORJA_WEB_URL: ${{ secrets.FORJA_WEB_URL }}
  # Public Turnstile site key — optional; empty hides in-app captcha (password login
  # fails if Auth captcha is enabled without a matching token).
  TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
  # Optional Sentry DSN for crash reporting (RFC-043).
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  # Optional PostHog product analytics (RFC-043).
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
  POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

jobs:
  validate_config:
    name: Validate cloud config
    runs-on: ubuntu-latest
    steps:
      - name: Require Supabase + web portal desktop client config
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (or legacy SUPABASE_ANON_KEY) repository secrets."
            exit 1
          fi
          if [[ -z "$FORJA_WEB_URL" ]]; then
            echo "::error::Set FORJA_WEB_URL repository secret to the deployed web portal origin (e.g. https://your-app.vercel.app)."
            exit 1
          fi
          case "$FORJA_WEB_URL" in
            http://127.0.0.1:*|http://localhost:*|https://127.0.0.1:*|https://localhost:*)
              echo "::error::FORJA_WEB_URL must be the public portal URL for release builds, not localhost."
              exit 1
              ;;
          esac

  macos:
    name: macOS arm64
    needs: validate_config
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: ./scripts/build_rust_release.sh
      - working-directory: ${{ env.APP_DIR }}
        env:
          # Compile without signing (no Apple certs on the runner). Frameworks are
          # ad-hoc signed in the next step — CODE_SIGNING_ALLOWED=NO alone leaves
          # them unsigned and dyld refuses to load them.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        run: |
          flutter pub get
          flutter build macos --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=RELEASE_CDN_URL="$RELEASE_CDN_URL" \
            --dart-define=FORJA_WEB_URL="$FORJA_WEB_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"
      - name: Ad-hoc codesign app bundle
        run: ./scripts/codesign_macos_adhoc.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-macOS-arm64
          path: apps/forja/build/macos/Build/Products/Release/

  macos_x86_64:
    name: macOS x86_64
    needs: validate_config
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: ./scripts/build_rust_release.sh
      - working-directory: ${{ env.APP_DIR }}
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        run: |
          flutter pub get
          flutter build macos --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=RELEASE_CDN_URL="$RELEASE_CDN_URL" \
            --dart-define=FORJA_WEB_URL="$FORJA_WEB_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"
      - name: Ad-hoc codesign app bundle
        run: ./scripts/codesign_macos_adhoc.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-macOS-x86_64
          path: apps/forja/build/macos/Build/Products/Release/

  windows:
    name: Windows
    needs: validate_config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - shell: bash
        run: ./scripts/build_rust_release.sh
      - working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=RELEASE_CDN_URL="$RELEASE_CDN_URL" \
            --dart-define=FORJA_WEB_URL="$FORJA_WEB_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"
      - shell: bash
        run: ./scripts/embed_rust_in_release_output.sh windows
      - shell: bash
        run: ./scripts/bundle_windows_msvc_crt.sh
      - shell: bash
        run: ./scripts/verify_installer_payload.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Windows
          path: apps/forja/build/windows/x64/runner/Release/

  linux:
    name: Linux
    needs: validate_config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - run: ./scripts/build_rust_release.sh
      - working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build linux --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=RELEASE_CDN_URL="$RELEASE_CDN_URL" \
            --dart-define=FORJA_WEB_URL="$FORJA_WEB_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"
      - run: ./scripts/embed_rust_in_release_output.sh linux
      - run: ./scripts/verify_installer_payload.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Linux
          path: apps/forja/build/linux/x64/release/bundle/

  android:
    name: Android
    needs: validate_config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=RELEASE_CDN_URL="$RELEASE_CDN_URL" \
            --dart-define=FORJA_WEB_URL="$FORJA_WEB_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            --dart-define=POSTHOG_HOST="$POSTHOG_HOST"
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Android
          path: apps/forja/build/app/outputs/flutter-apk/
