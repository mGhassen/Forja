# Forja — optional multi-platform build (manual only)
# Artifacts only — no version bump, no GitHub Release.
# Release packaging: .github/workflows/release.yml (manual)
name: Build Forja

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  APP_DIR: apps/forja

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: ./scripts/build_rust_release.sh
      - working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-macOS
          path: apps/forja/build/macos/Build/Products/Release/

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - shell: bash
        run: ./scripts/build_rust_release.sh
      - working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build windows --release
      - shell: bash
        run: ./scripts/embed_rust_in_release_output.sh windows
      - shell: bash
        run: ./scripts/verify_installer_payload.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Windows
          path: apps/forja/build/windows/x64/runner/Release/

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev
      - run: ./scripts/build_rust_release.sh
      - working-directory: ${{ env.APP_DIR }}
        run: |
          flutter pub get
          flutter build linux --release
      - run: ./scripts/embed_rust_in_release_output.sh linux
      - run: ./scripts/verify_installer_payload.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Linux
          path: apps/forja/build/linux/x64/release/bundle/

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Android
          path: apps/forja/build/app/outputs/flutter-apk/
