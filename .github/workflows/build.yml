# Forja — multi-platform CI (builds from apps/forja)
name: Build Forja

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable
  APP_DIR: apps/forja

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/forja
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-macOS
          path: apps/forja/build/macos/Build/Products/Release/

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/forja
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Windows
          path: apps/forja/build/windows/x64/runner/Release/

  linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forja
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Linux
          path: apps/forja/build/linux/x64/release/bundle/

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-Android
          path: apps/forja/build/app/outputs/flutter-apk/
