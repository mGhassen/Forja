name: Rust engine

on:
  push:
    paths:
      - 'crates/**'
      - 'packages/forja_rust/**'
      - 'scripts/build_rust.sh'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/forja_rust/**'
      - 'scripts/build_rust.sh'
      - '.github/workflows/rust.yml'

jobs:
  test:
    name: cargo test + Dart parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: cargo test
        run: |
          cd crates
          cargo test --workspace
          cargo test -p forja-utils --test golden
          cargo test -p forja-iptv-core --test golden_m3u
          cargo clippy --workspace
      - name: build release dylib
        run: ./scripts/build_rust.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Dart parity tests
        working-directory: packages/forja_rust
        run: |
          flutter pub get
          flutter test
