name: Rust engine

on:
  push:
    paths:
      - 'crates/**'
      - 'packages/forja_rust/**'
      - 'scripts/build_rust.sh'
      - 'scripts/build_rust_mobile.sh'
      - 'scripts/check_rust_mobile_artifacts.sh'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/forja_rust/**'
      - 'scripts/build_rust.sh'
      - 'scripts/build_rust_mobile.sh'
      - 'scripts/check_rust_mobile_artifacts.sh'
      - '.github/workflows/rust.yml'

jobs:
  test:
    name: cargo test + Dart parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: cargo test
        run: |
          cd crates
          cargo test --workspace
          cargo test -p forja-utils --test golden
          cargo test -p forja-iptv-core --test golden_m3u
          cargo clippy --workspace
      - name: build release dylib
        run: ./scripts/build_rust.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Dart parity tests
        working-directory: packages/forja_rust
        run: |
          flutter pub get
          flutter test
      - name: App engine smoke tests
        working-directory: apps/forja
        run: |
          flutter pub get
          flutter test integration_test/

  android-ffi:
    name: Android arm64 FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: build libforja_ffi.so
        run: ./scripts/build_rust_mobile.sh android
      - name: verify mobile artifact
        run: ./scripts/check_rust_mobile_artifacts.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: libforja_ffi-android-arm64
          path: apps/forja/android/app/src/main/jniLibs/arm64-v8a/libforja_ffi.so
          if-no-files-found: error

  ios-ffi:
    name: iOS arm64 FFI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: build libforja_ffi.dylib
        run: ./scripts/build_rust_mobile.sh ios
      - name: verify mobile artifact
        run: ./scripts/check_rust_mobile_artifacts.sh ios
      - uses: actions/upload-artifact@v4
        with:
          name: libforja_ffi-ios-arm64
          path: apps/forja/ios/Runner/Frameworks/libforja_ffi.dylib
          if-no-files-found: error
