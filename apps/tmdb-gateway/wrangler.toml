# Cloudflare Workers — primary host for tmdb.forjahq.xyz (issue 519)
name = "forja-tmdb-gateway"
main = "src/worker.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Account / zone: set via `wrangler login` or CLOUDFLARE_API_TOKEN
# Custom domain (after removing Vercel DNS for tmdb.forjahq.xyz):
# [[routes]]
# pattern = "tmdb.forjahq.xyz"
# custom_domain = true

[[r2_buckets]]
binding = "TMDB_R2"
bucket_name = "forja-tmdb"

[triggers]
crons = ["0 4 * * *"]

# Non-secret defaults (override in dashboard / wrangler.toml [vars] per env)
[vars]
TMDB_GATEWAY_PUBLIC_URL = "https://tmdb.forjahq.xyz"

# Secrets (do not put in this file) — set with:
#   npx wrangler secret put TMDB_API_KEYS
#   npx wrangler secret put TMDB_API_KEY
#   npx wrangler secret put TMDB_READ_ACCESS_TOKEN
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put TMDB_CACHE_PURGE_SECRET
#   npx wrangler secret put R2_TMDB_PUBLIC_BASE
# Optional Node/S3 fallback on Worker (prefer R2 binding + public base):
#   R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_TMDB_BUCKET R2_ENDPOINT
