org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9+: allow legacy proguard-android.txt in third-party plugins until they migrate.
android.r8.proguardAndroidTxt.disallowed=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compile Rust engine into jniLibs before APK build (requires Android NDK)
# Bundles libffi.so in release APK (preReleaseBuild). Debug: BUILD_RUST_ANDROID=1
buildRust=true
