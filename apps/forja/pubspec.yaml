name: forja
description: Forja — your cinema universe
publish_to: none
version: 1.2.406+36

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  carousel_slider: ^5.1.2
  google_fonts: ^8.0.2
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  visibility_detector: ^0.4.0+2
  smooth_page_indicator: ^2.0.1
  transparent_image: ^2.0.1
  palette_generator: ^0.3.3+4
  file_picker: ^8.0.0+1
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  flutter_js: ^0.8.0
  path: ^1.9.1
  path_parsing: ^1.1.0
  path_provider: ^2.1.5
  archive: ^4.0.4
  html: ^0.15.4
  xml: ^6.5.0
  crypto: ^3.0.5
  pointycastle: ^3.9.1
  ota_update: ^7.1.0
  screen_brightness: ^2.1.7
  volume_controller: ^3.4.1
  wakelock_plus: ^1.4.0
  floating: ^6.0.0
  android_intent_plus: ^5.1.0
  shared_preferences: ^2.5.2
  window_manager: ^0.5.1
  logging: ^1.2.0
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  permission_handler: ^11.3.1
  audioplayers: ^6.5.0
  connectivity_plus: 7.0.0
  package_info_plus: ^9.0.0
  media_kit:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/macos/media_kit_libs_macos_video
  media_kit_libs_android_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/android/media_kit_libs_android_video
  media_kit_libs_ios_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/ios/media_kit_libs_ios_video
  media_kit_libs_windows_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/windows/media_kit_libs_windows_video
  media_kit_libs_linux:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/linux/media_kit_libs_linux
  rust:
    path: ../../packages/rust
  supabase_flutter: ^2.16.0
  flutter_secure_storage: ^9.2.4
  passkeys: ^2.22.0
  sentry_flutter: ^9.25.0
  posthog_flutter: ^5.32.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: assets/icon/logo-icon-1024.png
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: assets/icon/logo-icon-1024.png

flutter_native_splash:
  color: "#f7f7f7"
  image: assets/icon/logo-light.png
  color_dark: "#141414"
  image_dark: assets/icon/logo-dark.png
  android_12:
    color: "#f7f7f7"
    image: assets/icon/logo-light.png
    color_dark: "#141414"
    image_dark: assets/icon/logo-dark.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sounds/
    - assets/images/
    - assets/images/nav/
    - assets/fonts/
    - assets/videasy/
    - assets/nuvio/

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/universal/media_kit_libs_video
  media_kit_libs_android_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/android/media_kit_libs_android_video
  media_kit_libs_ios_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/ios/media_kit_libs_ios_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/macos/media_kit_libs_macos_video
  media_kit_libs_windows_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/windows/media_kit_libs_windows_video
  media_kit_libs_linux:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/linux/media_kit_libs_linux
