<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark only" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Your Forja verification code</title>
    <!--[if mso]><style>body,table,td{font-family:Arial,sans-serif!important}</style><![endif]-->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0b0a0a;
      color: #ede6da;
      font-family: 'Instrument Sans', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
      Your Forja verification code is {{ .Token }}. Don’t share it.
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #0b0a0a; width: 100%">
      <tr>
        <td align="center" style="padding: 0">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 560px">
            <tr>
              <td style="height: 4px; line-height: 4px; font-size: 0; background-color: #ff4d1c">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding: 40px 32px 0 32px">
                <img
                  src="{{ .SiteURL }}/brand/logo-email.png"
                  alt="Forja"
                  width="120"
                  height="52"
                  style="display: block; width: 120px; height: auto; border: 0"
                />
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 32px 0 32px">
                <p
                  style="
                    margin: 0 0 12px 0;
                    font-family: 'Space Mono', 'Courier New', Courier, monospace;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 0.14em;
                    text-transform: uppercase;
                    color: #ff4d1c;
                  "
                >
                  Verify
                </p>
                <h1
                  style="
                    margin: 0;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 34px;
                    line-height: 1.15;
                    font-weight: 500;
                    letter-spacing: -0.02em;
                    color: #ede6da;
                  "
                >
                  Your verification code
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 18px 32px 0 32px;
                  font-size: 16px;
                  line-height: 1.55;
                  color: rgba(237, 230, 218, 0.62);
                "
              >
                Enter this code to confirm a sensitive change on
                <span style="color: #ede6da">{{ .Email }}</span>.
                It expires soon — don’t share it.
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 32px 0 32px" align="center">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color: #141212; margin: 0 auto">
                  <tr>
                    <td
                      style="
                        padding: 28px 40px;
                        border-left: 3px solid #1ce783;
                        font-family: 'Space Mono', 'Courier New', Courier, monospace;
                        font-size: 36px;
                        font-weight: 700;
                        letter-spacing: 0.22em;
                        color: #1ce783;
                        text-align: center;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px 32px 48px 32px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="height: 1px; line-height: 1px; font-size: 0; background-color: rgba(237, 230, 218, 0.12)">&nbsp;</td>
                  </tr>
                </table>
                <p style="margin: 20px 0 0 0; font-size: 12px; line-height: 1.55; color: rgba(237, 230, 218, 0.38)">
                  Forja ·
                  <a href="{{ .SiteURL }}" style="color: rgba(237, 230, 218, 0.38); text-decoration: none">{{ .SiteURL }}</a><br />
                  Didn’t request this? Ignore the email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
