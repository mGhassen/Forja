<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Your Forja verification code</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0b0a0a;
      color: #ede6da;
      font-family: 'Instrument Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #0b0a0a; width: 100%"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="520"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 520px;
              background-color: #141212;
              border: 1px solid rgba(237, 230, 218, 0.14);
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 36px 36px 28px 36px">
                <img
                  src="{{ .SiteURL }}/brand/logo-email.png"
                  alt="Forja"
                  width="140"
                  height="60"
                  style="display: block; width: 140px; height: auto; border: 0"
                />
              </td>
            </tr>
            <tr>
              <td style="padding: 0 36px 8px 36px">
                <h1
                  style="
                    margin: 0;
                    font-size: 24px;
                    line-height: 1.3;
                    font-weight: 600;
                    color: #ede6da;
                  "
                >
                  Verification code
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 36px 28px 36px;
                  font-size: 15px;
                  line-height: 1.6;
                  color: rgba(237, 230, 218, 0.72);
                "
              >
                Enter this code to confirm a sensitive change on your Forja account
                <strong style="color: #ede6da; font-weight: 500">{{ .Email }}</strong>.
              </td>
            </tr>
            <tr>
              <td style="padding: 0 36px 32px 36px" align="center">
                <div
                  style="
                    display: inline-block;
                    background-color: #1c1917;
                    border: 1px solid rgba(237, 230, 218, 0.14);
                    border-radius: 12px;
                    padding: 20px 28px;
                    font-size: 32px;
                    font-weight: 600;
                    letter-spacing: 0.2em;
                    color: #1ce783;
                    font-family: 'Space Mono', 'Courier New', Courier, monospace;
                  "
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 36px 32px 36px;
                  font-size: 13px;
                  line-height: 1.5;
                  color: rgba(237, 230, 218, 0.42);
                  text-align: center;
                "
              >
                This code expires soon. Don’t share it with anyone.
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 36px 28px 36px;
                  border-top: 1px solid rgba(237, 230, 218, 0.14);
                  font-size: 12px;
                  line-height: 1.5;
                  color: rgba(237, 230, 218, 0.42);
                "
              >
                Forja ·
                <a href="{{ .SiteURL }}" style="color: rgba(237, 230, 218, 0.42); text-decoration: none"
                  >{{ .SiteURL }}</a
                ><br />
                If you didn’t request this code, you can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
