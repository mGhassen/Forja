<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark only" />
    <meta name="supported-color-schemes" content="dark" />
    <title>You're invited to Forja</title>
    <!--[if mso]><style>body,table,td{font-family:Arial,sans-serif!important}</style><![endif]-->
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #0b0a0a;
      color: #ede6da;
      font-family: 'Instrument Sans', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all">
      Your Forja invite code is {{ .Token }}. Don’t share it.
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        width: 100%;
        background-color: #0b0a0a;
        background-image: radial-gradient(ellipse 90% 55% at 15% 0%, rgba(28, 231, 131, 0.22), transparent 55%),
          radial-gradient(ellipse 70% 50% at 95% 100%, rgba(255, 77, 28, 0.14), transparent 50%),
          radial-gradient(ellipse 50% 40% at 50% 50%, rgba(237, 230, 218, 0.04), transparent 70%);
      "
    >
      <tr>
        <td align="center" style="padding: 48px 20px">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              width: 100%;
              max-width: 560px;
              background-color: #121110;
              border: 1px solid rgba(237, 230, 218, 0.14);
              border-radius: 20px;
              overflow: hidden;
            "
          >
            <tr>
              <td style="height: 3px; line-height: 3px; font-size: 0; background-color: #1ce783">&nbsp;</td>
            </tr>
            <tr>
              <td style="padding: 40px 32px 0 32px">
                <img
                  src="{{ .SiteURL }}/brand/logo-email.png"
                  alt="Forja"
                  width="120"
                  height="52"
                  style="display: block; width: 120px; height: auto; border: 0"
                />
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 32px 0 32px">
                <p
                  style="
                    margin: 0 0 12px 0;
                    font-family: 'Space Mono', 'Courier New', Courier, monospace;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 0.14em;
                    text-transform: uppercase;
                    color: #1ce783;
                  "
                >
                  Invite
                </p>
                <h1
                  style="
                    margin: 0;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 34px;
                    line-height: 1.15;
                    font-weight: 500;
                    letter-spacing: -0.02em;
                    color: #ede6da;
                  "
                >
                  You’re invited
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 18px 32px 0 32px;
                  font-size: 16px;
                  line-height: 1.55;
                  color: rgba(237, 230, 218, 0.62);
                "
              >
                Enter this code to accept the invite for
                <span style="color: #ede6da">{{ .Email }}</span>,
                then set your password. It expires soon — don’t share it.
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 32px 0 32px" align="center">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="
                    margin: 0 auto;
                    background-color: rgba(255, 255, 255, 0.04);
                    border: 1px solid rgba(237, 230, 218, 0.1);
                    border-radius: 14px;
                    overflow: hidden;
                  "
                >
                  <tr>
                    <td
                      style="
                        padding: 28px 40px;
                        border-left: 3px solid #1ce783;
                        font-family: 'Space Mono', 'Courier New', Courier, monospace;
                        font-size: 36px;
                        font-weight: 700;
                        letter-spacing: 0.22em;
                        color: #1ce783;
                        text-align: center;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 40px 32px 48px 32px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="height: 1px; line-height: 1px; font-size: 0; background-color: rgba(237, 230, 218, 0.12)">&nbsp;</td>
                  </tr>
                </table>
                <p style="margin: 20px 0 0 0; font-size: 12px; line-height: 1.55; color: rgba(237, 230, 218, 0.38)">
                  Forja ·
                  <a href="{{ .SiteURL }}" style="color: rgba(237, 230, 218, 0.38); text-decoration: none">{{ .SiteURL }}</a><br />
                  Didn’t expect this? Ignore the email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
