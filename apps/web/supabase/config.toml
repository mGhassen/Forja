# A string used to distinguish different Supabase projects on the same host.
# Defaults to the working directory name when running `supabase init`.
project_id = "forja-dev"

[api]
# Port to use for the API URL.
# Dose uses 64321 — keep Forja on a separate band.
port = 55321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. public and storage are always included.
schemas = ["public", "storage", "graphql_public"]
# Extra schemas to add to the search_path of every request. public is always included.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 55322
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
# Port to use for Supabase Studio.
port = 55323

# Email testing server (Mailpit). Emails are not sent — view them in the web UI.
[local_smtp]
port = 55324
smtp_port = 55325
pop3_port = 55326

[storage]
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

[auth]
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails. Matches apps/web Vite `server.port`.
site_url = "http://localhost:3000"
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/login",
  "http://localhost:3000/signup",
  "http://localhost:3000/account",
  "http://localhost:3000/auth/callback",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 seconds (one
# week).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
enable_signup = true

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# Local: skip inbox confirmation so create-test-users + signup work without Inbucket clicks.
# Set true when testing the real confirmation email flow.
enable_confirmations = false

# Branded Forja auth emails (source of truth in templates/). Hosted: paste into
# Dashboard → Authentication → Email Templates — see supabase/README.md.
[auth.email.template.confirmation]
subject = "Confirm your Forja account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Forja password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Forja sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You're invited to Forja"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your new email"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your Forja verification code"
content_path = "./supabase/templates/reauthentication.html"

# Bot protection — Cloudflare Turnstile (same provider as hosted Supabase Auth).
# Dummy always-pass secret pairs with VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA
# in apps/web/.env. Hosted: set real keys in Dashboard → Auth → Bot and Abuse Protection
# and Vercel env VITE_TURNSTILE_SITE_KEY.
[auth.captcha]
enabled = true
provider = "turnstile"
secret = "1x0000000000000000000000000000000AA"

[analytics]
enabled = false

# Public release sync — called without a user JWT from CI / dashboard.
[functions.sync-github-releases]
verify_jwt = false
