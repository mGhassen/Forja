[package]
name = "ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib", "staticlib"]
name = "ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = ["torrent-engine", "local-proxy", "lan-server"]
torrent-engine = ["dep:torrent"]
local-proxy = ["dep:proxy"]
lan-server = ["dep:lan", "torrent-engine", "local-proxy"]
cli = ["uniffi/cli"]

[dependencies]
utils = { path = "../utils" }
stream = { path = "../stream" }
iptv = { path = "../iptv" }
stremio = { path = "../stremio" }
scrapers = { path = "../scrapers" }
torrent = { path = "../torrent", optional = true }
proxy = { path = "../proxy", optional = true }
lan = { path = "../lan", optional = true }
storage = { path = "../storage" }
tmdb = { path = "../tmdb" }
anime = { path = "../anime" }
indexer = { path = "../indexer" }
debrid = { path = "../debrid" }
live-matches = { path = "../live-matches" }
provider-health = { path = "../provider-health" }
engine-js = { path = "../engine-js" }
uniffi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
