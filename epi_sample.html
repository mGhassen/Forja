<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #player { position: fixed; inset: 0; z-index: 1; background: #000; }
    #player > div { width: 100% !important; height: 100% !important; }
    .unmute-btn { position: fixed; top: 20px; left: 20px; z-index: 20; display: none; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 50px; background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: all 0.25s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .unmute-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); box-shadow: 0 6px 25px rgba(0,0,0,0.4); }
    .unmute-btn:active { transform: scale(0.98); }
    .unmute-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .embed-btn { position: fixed; top: 20px; right: 20px; z-index: 25; display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 50px; background: rgba(255,255,255,0.15); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 4px 20px rgba(0,0,0,0.3); opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.25s ease, background 0.25s ease; }
    .embed-btn.visible { opacity: 1; visibility: visible; }
    .embed-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); box-shadow: 0 6px 25px rgba(0,0,0,0.4); }
    .embed-btn:active { transform: scale(0.98); }
    .embed-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .embed-modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .embed-modal.open { display: flex; }
    .embed-box { position: relative; width: min(92vw, 560px); background: #15171c; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); color: #fff; }
    .embed-box h3 { font-size: 16px; font-weight: 600; margin-bottom: 14px; padding-right: 34px; }
    .embed-code { display: block; width: 100%; min-height: 110px; background: #0b0c0f; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #cfd3da; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.55; padding: 14px; resize: none; white-space: pre-wrap; word-break: break-all; user-select: text !important; -webkit-user-select: text !important; -webkit-touch-callout: default !important; }
    .embed-actions { display: flex; gap: 10px; margin-top: 14px; }
    .embed-copy { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #3498db; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: background 0.2s ease; }
    .embed-copy:hover { background: #2c80b8; }
    .embed-close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border: none; border-radius: 8px; background: rgba(255,255,255,0.08); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s ease; }
    .embed-close:hover { background: rgba(255,255,255,0.18); }
    * { -webkit-user-select: none !important; -moz-user-select: none !important; -ms-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
    @media print { * { display: none !important; } }
    img { pointer-events: none; -webkit-user-drag: none; user-drag: none; }
  </style>

  (function() {
    var btn = document.getElementById('embedBtn');
    var modal = document.getElementById('embedModal');
    var closeBtn = document.getElementById('embedClose');
    var copyBtn = document.getElementById('embedCopy');
    var codeEl = document.getElementById('embedCode');
    var embedCode =
      '<iframe src="' + window.location.href + '" ' +
      'width="100%" height="100%" frameborder="0" scrolling="no" ' +
      'allow="autoplay; encrypted-media; picture-in-picture; fullscreen" ' +
      'allowfullscreen></iframe>';
    
    codeEl.value = embedCode;
    var hideTimer;
    var modalOpen = false;
    
    function showBtn() {
      btn.classList.add('visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function() { if (!modalOpen) btn.classList.remove('visible'); }, 2500);
    }
    
    document.addEventListener('mousemove', showBtn);
    document.addEventListener('touchstart', showBtn, { passive: true });
    btn.addEventListener('mouseenter', function() { clearTimeout(hideTimer); });
    btn.addEventListener('mouseleave', showBtn);
    showBtn();
    
    function copyText(text, srcBtn) {
      var done = function() {
        if (!srcBtn) return;
        var orig = srcBtn.textContent;
        srcBtn.textContent = 'Copied!';
        setTimeout(function() { srcBtn.textContent = orig; }, 1500);
      };
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else { 
        fallback(); 
      }
      
      function fallback() {
        codeEl.removeAttribute('readonly');
        codeEl.focus(); 
        codeEl.select();
        codeEl.setSelectionRange(0, codeEl.value.length);
        try { document.execCommand('copy'); } catch (e) {}
        codeEl.setAttribute('readonly', '');
        done();
      }
    }
    
    function openModal() { modal.classList.add('open'); modalOpen = true; clearTimeout(hideTimer); copyText(embedCode); }
    function closeModal() { modal.classList.remove('open'); modalOpen = false; showBtn(); }
    
    btn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    copyBtn.addEventListener('click', function() { copyText(embedCode, copyBtn); });
    modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && modalOpen) closeModal(); });
