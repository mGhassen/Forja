name: rust
description: Dart FFI bindings to the Forja Rust engine
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.1.4
  core:
    path: ../core
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  html: ^0.15.4
  crypto: ^3.0.6
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  api:
    path: ../api
  webstreamr:
    path: ../webstreamr

flutter:
  uses-material-design: true
