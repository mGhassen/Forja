name: streaming
description: Stream resolution, torrent engine, and local proxy for Forja
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_proxy: ^1.0.4
  flutter_inappwebview: ^6.1.5
  flutter_js: ^0.8.0
  crypto: ^3.0.5
  html: ^0.15.4
  logging: ^1.2.0
  core:
    path: ../core
  storage:
    path: ../storage
  api:
    path: ../api
  rust:
    path: ../rust
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/universal/media_kit_libs_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/macos/media_kit_libs_macos_video

