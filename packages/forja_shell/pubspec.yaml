name: forja_shell
description: App shell, bootstrap, and navigation for Forja
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  media_kit:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit_video
  window_manager: ^0.5.1
  logging: ^1.2.0
  audio_service: ^0.18.17
  connectivity_plus: 7.0.0
  flutter_inappwebview: ^6.1.5
  forja_core:
    path: ../forja_core
  forja_storage:
    path: ../forja_storage
  forja_api:
    path: ../forja_api
  forja_streaming:
    path: ../forja_streaming
  forja_ui:
    path: ../forja_ui
  forja_iptv:
    path: ../forja_iptv

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/universal/media_kit_libs_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/macos/media_kit_libs_macos_video

