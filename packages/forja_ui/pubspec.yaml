name: forja_ui
description: Feature screens and widgets for Forja
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  visibility_detector: ^0.4.0+2
  smooth_page_indicator: ^2.0.1
  transparent_image: ^2.0.1
  palette_generator: ^0.3.3+4
  file_picker: ^8.0.0+1
  url_launcher: ^6.3.1
  flutter_inappwebview: ^6.1.5
  libtorrent_flutter: 1.8.5
  media_kit:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit_video
  forja_core:
    path: ../forja_core
  forja_storage:
    path: ../forja_storage
  forja_api:
    path: ../forja_api
  forja_scrapers:
    path: ../forja_scrapers
  forja_webstreamr:
    path: ../forja_webstreamr
  forja_streaming:
    path: ../forja_streaming
  forja_iptv:
    path: ../forja_iptv
  forja_player:
    path: ../forja_player

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/universal/media_kit_libs_video
  media_kit_libs_macos_video:
    git:
      url: https://github.com/AimesSoft/media-kit.git
      path: libs/macos/media_kit_libs_macos_video

